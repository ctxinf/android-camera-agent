name: Release APKs

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check release version
        run: python3 tools/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Prepare version and signing key
        env:
          ANDROID_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ANDROID_SIGNING_PRIVATE_KEY_PEM }}
          ANDROID_SIGNING_CERTIFICATE_PEM: ${{ secrets.ANDROID_SIGNING_CERTIFICATE_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH[-prerelease]'; exit 1; }
          for name in ANDROID_SIGNING_PRIVATE_KEY_PEM ANDROID_SIGNING_CERTIFICATE_PEM; do
            [[ -n "${!name}" ]] || { echo "Missing signing secret: $name"; exit 1; }
          done
          umask 077
          SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/release-signing.XXXXXX")
          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          ANDROID_KEYSTORE_PATH="$SIGNING_DIR/release.p12"
          ANDROID_KEYSTORE_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEYSTORE_PASSWORD
          printf '%s' "$ANDROID_SIGNING_PRIVATE_KEY_PEM" > "$SIGNING_DIR/private-key.pem"
          printf '%s' "$ANDROID_SIGNING_CERTIFICATE_PEM" > "$SIGNING_DIR/certificate.pem"
          openssl pkcs12 -export -name camera-agent \
            -inkey "$SIGNING_DIR/private-key.pem" -in "$SIGNING_DIR/certificate.pem" \
            -out "$ANDROID_KEYSTORE_PATH" -passout env:ANDROID_KEYSTORE_PASSWORD
          rm -f "$SIGNING_DIR/private-key.pem" "$SIGNING_DIR/certificate.pem"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=camera-agent" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null'
      - name: Test and build both variants
        shell: bash
        run: |
          set -euo pipefail
          for project in android-8.0-camera-agent android-4.0-camera-agent/android; do
            (cd "$project" && bash ./gradlew --no-daemon testReleaseUnitTest assembleRelease)
          done
          mkdir -p dist
          cp android-8.0-camera-agent/app/build/outputs/apk/release/app-release.apk "dist/camera-agent-android8-${GITHUB_REF_NAME}.apk"
          cp android-4.0-camera-agent/android/app/build/outputs/apk/release/app-release.apk "dist/camera-agent-android4-${GITHUB_REF_NAME}.apk"
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: |
          if [[ -n "${SIGNING_DIR:-}" ]]; then rm -rf -- "$SIGNING_DIR"; fi

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${options[@]}"
