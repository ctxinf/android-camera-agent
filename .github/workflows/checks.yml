name: Source checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/check_release.py
      - run: python3 tools/check_i18n.py
