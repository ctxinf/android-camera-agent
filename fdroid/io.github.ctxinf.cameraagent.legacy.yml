AutoName: Camera Agent Legacy
Summary: On-demand camera with HTTP, MCP and Home Assistant support
Description: |-
  Turn a spare Android phone into an on-demand network camera.
  Access snapshots and MJPEG video over HTTP, give AI agents access through
  MCP, or integrate with Home Assistant using MQTT discovery.
  Camera access is released when idle. No account or hosted service is required.

