plugins {
    id 'com.android.application'
}

def releaseVersion = new Properties()
rootProject.file('../../version.properties').withInputStream { releaseVersion.load(it) }

android {
    namespace 'io.github.ctxinf.cameraagent.legacy'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.ctxinf.cameraagent.legacy'
        // API 14 floor per the compatibility target; the test device is API 18.
        minSdk 14
        targetSdk 18
        versionCode = releaseVersion.getProperty('versionCode').toInteger()
        versionName = releaseVersion.getProperty('versionName')
        resValue 'string', 'build_ref', 'v' + versionName
    }

    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_PATH')) {
            ciRelease {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-dev'
            resValue 'string', 'build_ref', 'v' + releaseVersion.getProperty('versionName') + '-dev'
        }
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.ciRelease
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // Old-API surfaces (Camera, MediaRecorder) are deliberate, not oversights.
        disable 'UnusedAttribute'
        // This legacy APK is distributed on GitHub, not Google Play.
        // A future Play release must migrate targetSdk before submission.
        disable 'ExpiredTargetSdkVersion'
    }
}

// No runtime dependencies: everything used is Android framework API.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
